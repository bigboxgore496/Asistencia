<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASISTENCIA V5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">ASISTENCIA V5</h1>
        
        <!-- Contenedor principal -->
        <div id="app">
            {% if not user %}
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-sm p-4">
                        <h2 class="mb-3">Bienvenido</h2>
                        <p class="text-muted">Acceso seguro a la plataforma</p>
                        <form id="login-form" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" id="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                        </form>
                        <div class="mt-3 small text-muted">
                            Demo administrador: admin / admin123<br>
                            Empleados demo: carlos / 123456 - maria / 123456 - juan / 123456
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="card shadow-sm p-4">
                <h2>Panel de Control</h2>
                <p>Bienvenido, <strong>{{ user.username }}</strong> (Rol: {{ user.role }})</p>
                <button onclick="handleLogout()" class="btn btn-danger">Cerrar sesión</button>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            if (res.ok) {
                window.location.reload();
            } else {
                const err = await res.json();
                alert(err.error || 'Error al iniciar sesión');
            }
        }

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.reload();
        }

        function render() {
            // Verificación segura para evitar errores de elementos indefinidos
            const el = document.getElementById('app');
            if (el) {
                el.classList.add('loaded');
            }
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
